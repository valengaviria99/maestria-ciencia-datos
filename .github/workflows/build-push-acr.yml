name: Build and push PyCaret image

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "Proyecto/sample-pycaret/**"
      - ".github/workflows/build-push-acr.yml"

permissions:
  contents: read

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Docker
        uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: ./Proyecto/sample-pycaret
          file: ./Proyecto/sample-pycaret/Dockerfile
          push: true
          tags: |
            ${{ secrets.ACR_LOGIN_SERVER }}/sample-pycaret:latest
            ${{ secrets.ACR_LOGIN_SERVER }}/sample-pycaret:${{ github.sha }}
